global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "rag-app"
    static_configs:
      - targets: ["rag-app:8001"]

  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
